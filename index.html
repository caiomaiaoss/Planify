<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Planify — Calendário Inteligente Acadêmico</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef3f1;--sf:#fff;--tx:#14262b;--mu:#5d7278;--ln:#d5e0dd;--ac:#0b7a6e;--ac2:#e3f2ef;--ok:#1f9d55;--wa:#e0a100;--er:#d64545;--sh:rgba(10,40,40,.08);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1819;--sf:#152426;--tx:#e6f0ee;--mu:#93a9a6;--ln:#2a3e40;--ac:#3cc2b0;--ac2:#173431;--sh:rgba(0,0,0,.3);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1819;--sf:#152426;--tx:#e6f0ee;--mu:#93a9a6;--ln:#2a3e40;--ac:#3cc2b0;--ac2:#173431;--sh:rgba(0,0,0,.3);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:400 15px/1.45 "Bricolage Grotesque",system-ui,Segoe UI,sans-serif}
button,input,select{font:inherit;color:inherit}
header{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;justify-content:space-between;padding:14px clamp(14px,4vw,40px);background:var(--sf);border-bottom:4px solid transparent;border-image:linear-gradient(90deg,#0b9a87,#2d8fd5,#8e6bd9,#d6559b,#e8505b,#f2a900) 1}
.logo{font-weight:800;font-size:24px;letter-spacing:-.02em;color:var(--ac)}
.logo small{display:block;font-weight:400;font-size:12px;color:var(--mu);letter-spacing:0}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav button{background:none;border:0;padding:8px 14px;border-radius:99px;cursor:pointer;color:var(--mu);font-weight:600;transition:background .15s}
nav button:hover{background:var(--ac2)}
nav button[aria-current=true]{background:var(--ac);color:var(--bg)}
main{max-width:1100px;margin:0 auto;padding:22px clamp(14px,4vw,40px) 70px}
h2{margin:0 0 4px;font-size:28px;letter-spacing:-.02em}
.sub{color:var(--mu);margin:0 0 16px}
.btn{background:var(--ac);color:var(--bg);border:0;border-radius:8px;padding:9px 16px;font-weight:600;cursor:pointer}
.btn:hover{filter:brightness(1.1)}
.ghost{background:none;border:1px solid var(--ln);border-radius:8px;padding:8px 14px;cursor:pointer}
.ghost:hover{border-color:var(--ac)}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:16px;box-shadow:0 1px 3px var(--sh)}
.sc{border-top:5px solid var(--c)}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(290px,1fr))}
.stats{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));margin-bottom:18px}
.stat b{display:block;font-size:26px;line-height:1.1;letter-spacing:-.02em}
.stat span{color:var(--mu);font-size:13px}
.big{font-size:44px;font-weight:800;line-height:1;letter-spacing:-.03em}
.row{display:flex;gap:8px;justify-content:space-between;align-items:center}
.tag{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:600;color:#fff}
.boxes{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0}
.bx{width:26px;height:26px;border-radius:7px;border:2px solid var(--c);background:none;cursor:pointer;transition:transform .12s,background .12s}
.bx:hover{transform:scale(1.15)}
.bx.on{background:var(--c)}
.meter{height:10px;background:var(--ln);border-radius:6px;overflow:hidden;margin:14px 0}
.meter i{display:block;height:100%;background:var(--c)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.chip{border:1px solid var(--ln);background:var(--sf);border-radius:99px;padding:4px 12px;cursor:pointer;font-size:13px}
.chip[aria-pressed=true]{background:var(--ac);color:var(--bg);border-color:var(--ac)}
.scroll{overflow-x:auto}
table{border-collapse:separate;border-spacing:4px;width:100%;min-width:640px}
th{font-size:13px;padding:8px 4px;border-radius:8px;background:var(--ac2);color:var(--mu)}
th.td{background:var(--ac);color:var(--bg)}
td.cell{height:52px;cursor:pointer;border-radius:8px;border:1px dashed var(--ln);text-align:center;padding:3px;min-width:84px}
td.cell:hover{border-color:var(--ac);background:var(--ac2)}
.pill{display:block;border-radius:6px;padding:6px;font-weight:600;font-size:12px;border-left:4px solid var(--c);background:color-mix(in srgb,var(--c) 25%,var(--sf));overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;min-width:640px}
.cal .h{text-align:center;font-weight:600;color:var(--mu);font-size:12px;padding:4px}
.day{min-height:92px;background:var(--sf);border:1px solid var(--ln);border-radius:8px;padding:5px;cursor:pointer;font-size:12px;text-align:left;display:block;width:100%;overflow:hidden}
.day:hover{border-color:var(--ac);transform:translateY(-1px)}
.day.out{opacity:.4}
.day.today{border:2px solid var(--ac);background:var(--ac2)}
.day.hl{background:color-mix(in srgb,#f2a900 12%,var(--sf))}
.hol{color:#b86a00;font-weight:600;font-size:11px;display:block}
.ev{display:block;margin-top:2px;padding:1px 5px;border-radius:4px;font-size:11px;border-left:3px solid var(--c);background:color-mix(in srgb,var(--c) 25%,var(--sf));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.more{color:var(--mu);font-size:11px}
.list{display:grid;gap:8px}
.item{display:flex;gap:12px;align-items:center;background:var(--sf);border:1px solid var(--ln);border-left:5px solid var(--c);border-radius:10px;padding:10px 14px}
.item.done{opacity:.5}
.item.done .tt{text-decoration:line-through}
.dt{min-width:44px;text-align:center;font-weight:800;line-height:1.1}
.dt small{display:block;font-weight:400;color:var(--mu);font-size:11px}
.x{background:none;border:0;color:var(--mu);cursor:pointer;font-size:18px;padding:2px 6px}
.x:hover{color:var(--er)}
dialog{border:1px solid var(--ln);border-radius:14px;background:var(--sf);color:var(--tx);padding:20px;width:min(430px,92vw)}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog h3{margin:0 0 10px}
label{display:block;font-size:13px;color:var(--mu);margin:10px 0 3px}
input,select{width:100%;padding:8px 10px;border:1px solid var(--ln);border-radius:8px;background:var(--bg)}
input[type=checkbox]{width:auto}
dialog .row.end{margin-top:16px;justify-content:flex-end}
.sws{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:28px;height:28px;border-radius:50%;border:3px solid transparent;background:var(--c);cursor:pointer}
.sw.on{border-color:var(--tx)}
.li{padding:5px 0;border-bottom:1px solid var(--ln)}
.empty{text-align:center;padding:34px;color:var(--mu)}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(30px);background:var(--tx);color:var(--bg);padding:10px 18px;border-radius:99px;opacity:0;pointer-events:none;transition:.25s;max-width:90vw;z-index:50}
#toast.on{opacity:1;transform:translateX(-50%)}
.week{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}.wd{background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:8px;min-height:120px}.wh{font-weight:700;text-align:center;padding:4px;border-radius:6px;background:var(--ac2);color:var(--mu);margin-bottom:6px}.wh.td{background:var(--ac);color:var(--bg)}.week .pill{width:100%;text-align:left;border:0;border-left:4px solid var(--c);cursor:pointer;margin-bottom:4px;white-space:normal}.addb{width:100%;border:1px dashed var(--ln);background:none;border-radius:6px;cursor:pointer;color:var(--mu)}textarea{width:100%;background:var(--bg);color:var(--tx);border:1px solid var(--ln);border-radius:8px;padding:8px;font:inherit}
#bot{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:40}#fab{width:58px;height:58px;border-radius:50%;border:0;background:var(--ac);color:var(--bg);font-size:28px;cursor:pointer;box-shadow:0 4px 14px var(--sh);position:relative}#fab.al::after{content:"";position:absolute;top:2px;right:2px;width:14px;height:14px;border-radius:50%;background:var(--er);border:2px solid var(--sf)}#panel{display:none;position:absolute;right:0;bottom:70px;width:min(350px,calc(100vw - 32px));height:min(480px,70vh);background:var(--sf);border:1px solid var(--ln);border-radius:16px;box-shadow:0 8px 30px var(--sh);flex-direction:column;overflow:hidden}#panel.on{display:flex}.ph{padding:12px 14px;background:var(--ac);color:var(--bg);font-weight:700}#msgs{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px}.m{max-width:88%;padding:8px 12px;border-radius:14px;background:var(--ac2);align-self:flex-start;font-size:14px}.m.u{background:var(--ac);color:var(--bg);align-self:flex-end}.qs{display:flex;gap:6px;flex-wrap:wrap;padding:0 12px 8px}.pf{display:flex;gap:6px;padding:10px;border-top:1px solid var(--ln)}
body{background:radial-gradient(1100px 480px at 85% -10%,color-mix(in srgb,var(--ac) 16%,transparent),transparent),var(--bg)}
.hero{background:linear-gradient(120deg,#0b9a87,#2d8fd5 55%,#8e6bd9);color:#fff;border-radius:16px;padding:16px 20px;margin-bottom:20px;box-shadow:0 8px 24px var(--sh)}.hero h3{margin:0;font-size:20px}.hero p{margin:2px 0 0;opacity:.9;font-size:14px}.hc{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.hc span{background:rgba(255,255,255,.2);border-radius:99px;padding:3px 12px;font-size:13px}
.card,.item,.wd{animation:up .35s ease both}@keyframes up{from{opacity:0;transform:translateY(8px)}}.card{transition:transform .15s,box-shadow .15s}.card:hover{transform:translateY(-2px);box-shadow:0 10px 24px var(--sh)}.bx.on{animation:pop .25s}@keyframes pop{50%{transform:scale(1.35)}}
.hc2{display:flex;gap:6px;flex-wrap:wrap}.hc2 span{font-size:12px;padding:3px 10px;border-radius:99px;background:color-mix(in srgb,var(--c) 22%,var(--sf));border:1px solid var(--c)}.hc2 .no{border-style:dashed;color:var(--mu);border-color:var(--ln);background:none}
.tr{display:grid;grid-template-columns:44px 1fr 1fr;gap:8px;align-items:center;margin-top:8px}.tr b{color:var(--ac)}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
</style>
</head>
<body>
<header>
  <div class="logo">Planify<small>Calendário inteligente do estudante</small></div>
  <nav id="nav"></nav>
  <button class="ghost" id="theme" aria-label="Alternar modo claro e escuro">🌗 Tema</button>
</header>
<main id="app"></main>
<dialog id="dlg"><div id="dlgb"></div></dialog>
<div id="toast" role="status"></div>

<script>
var KEY="planify-v2",PAL=["#0b9a87","#e8505b","#f2a900","#8e6bd9","#2d8fd5","#e27d3a","#3fa34d","#d6559b"];
var TYPES={prova:["Prova","📝"],trabalho:["Trabalho","📦"],seminario:["Seminário","🎤"],falta:["Falta","⛔"],outro:["Outro","📌"]};
var DAYS=["Segunda","Terça","Quarta","Quinta","Sexta","Sábado"],TIMES=["07:30–09:30","09:30–11:30","13:30–15:30","15:30–17:30","19:00–20:45","20:45–22:30"];
var HOL={"2027-01-01":"Confraternização","2027-02-08":"Carnaval","2027-02-09":"Carnaval","2027-02-10":"Cinzas","2027-03-26":"Sexta-Feira Santa","2027-03-28":"Páscoa","2027-04-21":"Tiradentes","2027-05-01":"Dia do Trabalho","2027-05-27":"Corpus Christi","2027-09-07":"Independência","2027-10-12":"N. Sra. Aparecida","2027-11-02":"Finados","2027-11-15":"Proclamação da República","2027-11-20":"Consciência Negra","2027-12-25":"Natal"};
var MONTHS=["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
var S={subjects:[],slots:{},events:[]},view="materias",cur=new Date(2027,1,1),filt="todas";
try{var raw=localStorage.getItem(KEY);if(raw)S=JSON.parse(raw)}catch(e){}
S.blocks=S.blocks||[];S.grades=S.grades||{};
var $=function(s){return document.querySelector(s)},$$=function(s){return document.querySelectorAll(s)};
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function esc(t){return String(t).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function uid(){return Math.random().toString(36).slice(2,9)}
function iso(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function br(s){return s.split("-").reverse().join("/")}
function subj(id){return S.subjects.find(function(s){return s.id===id})}
function sc(id){var s=subj(id);return s?s.color:"#8a9a9a"}
function sn(id){var s=subj(id);return s?s.name:"—"}
function state(s){var r=s.used/s.max;if(s.used>s.max)return["var(--er)","Passou do limite"];if(s.used===s.max)return["var(--er)","Limite atingido"];if(r>=.7)return["var(--wa)","Atenção"];return["var(--ok)","Tranquilo"]}
var tt;function toast(m){var t=$("#toast");t.textContent=m;t.className="on";clearTimeout(tt);tt=setTimeout(function(){t.className=""},3200)}
function modal(title,html,onOk,label){$("#dlgb").innerHTML="<h3>"+title+"</h3>"+html+'<div class="row end"><button class="ghost" id="cx">Fechar</button>'+(onOk?'<button class="btn" id="ok">'+(label||"Salvar")+"</button>":"")+"</div>";$("#dlg").showModal();$("#cx").onclick=function(){$("#dlg").close()};if(onOk)$("#ok").onclick=function(){if(onOk()!==false)$("#dlg").close()}}
function subjOpts(sel,extra){return (extra||"")+S.subjects.map(function(s){return '<option value="'+s.id+'"'+(s.id===sel?" selected":"")+">"+esc(s.name)+"</option>"}).join("")}
function needSubj(){if(!S.subjects.length){modal("Cadastre uma matéria primeiro","<p>Na aba Faltas, adicione suas disciplinas.</p>",function(){go("faltas")},"Ir para Faltas");return true}return false}
function go(v){view=v;render()}
function render(){
  var tabs=[["materias","📚 Matérias"],["faltas","🚦 Faltas"],["rotina","🗓️ Rotina"],["avaliacoes","📝 Avaliações"],["notas","🎓 Notas"],["calendario","📅 Calendário"]];
  $("#nav").innerHTML=tabs.map(function(t){return '<button data-v="'+t[0]+'" aria-current="'+(view===t[0])+'">'+t[1]+"</button>"}).join("");
  $$("#nav button").forEach(function(b){b.onclick=function(){go(b.dataset.v)}});
  ({faltas:vFaltas,rotina:vRotina,avaliacoes:vAval,calendario:vCal,notas:vNotas,materias:vMaterias})[view]();heroBar();
}
function nextEvents(){var t=iso(new Date());return S.events.filter(function(e){return e.type!=="falta"&&!e.done&&e.date>=t}).sort(function(a,b){return a.date<b.date?-1:1})}
function daysTo(d){return Math.round((new Date(d+"T12:00")-new Date())/864e5)}

function subjForm(s){
  var pick=s?s.color:PAL[S.subjects.length%PAL.length];
  modal(s?"Editar matéria":"Nova matéria",'<label>Nome da matéria</label><input id="n" value="'+(s?esc(s.name):"")+'" placeholder="Ex.: Cálculo I"><label>Quantas faltas essa matéria permite?</label><input id="c" type="number" min="1" max="99" value="'+(s?s.max:8)+'"><label>Cor</label><div class="sws">'+PAL.map(function(c){return '<button type="button" class="sw'+(c===pick?" on":"")+'" style="--c:'+c+'" data-c="'+c+'" aria-label="Cor"></button>'}).join("")+"</div>",function(){
    var n=$("#n").value.trim(),c=parseInt($("#c").value,10);if(!n||!c||c<1){$("#n").focus();return false}
    if(s){s.name=n;s.max=c;s.color=pick}else S.subjects.push({id:uid(),name:n,max:c,used:0,color:pick});save();render()});
  $$(".sw").forEach(function(b){b.onclick=function(){pick=b.dataset.c;$$(".sw").forEach(function(x){x.classList.toggle("on",x===b)})}});
}
function bump(id,d){var s=subj(id);s.used=Math.max(0,s.used+d);save();render();
  if(d>0){if(s.used>s.max)toast("Você passou do limite de "+s.name);else if(s.used===s.max)toast("Limite de faltas atingido em "+s.name);else if(s.used>=.7*s.max)toast("Atenção: restam só "+(s.max-s.used)+" faltas em "+s.name)}}

function vFaltas(){
  var used=0,all=0,risk=0;S.subjects.forEach(function(s){used+=s.used;all+=s.max;if(s.used>=.7*s.max)risk++});
  var n=nextEvents()[0],h='<h2>Controle de faltas</h2><p class="sub">Defina quantas faltas cada matéria permite e marque uma a uma. O alerta amarelo aparece a partir de 70% do limite.</p>';
  if(S.subjects.length)h+='<div class="stats"><div class="card stat"><b>'+used+" / "+all+'</b><span>faltas usadas</span></div><div class="card stat"><b style="color:'+(risk?"var(--wa)":"var(--ok)")+'">'+risk+'</b><span>matérias em alerta</span></div><div class="card stat"><b>'+(n?(daysTo(n.date)<=0?"hoje":daysTo(n.date)+" dias"):"—")+'</b><span>'+(n?esc(TYPES[n.type][1]+" "+sn(n.subj)):"próxima avaliação")+"</span></div></div>";
  h+='<div class="bar"><button class="btn" id="add">Cadastrar matérias</button>'+(S.subjects.length?"":'<button class="ghost" id="demo">Carregar exemplo</button>')+"</div>";
  if(!S.subjects.length)h+='<div class="card empty">Nenhuma matéria ainda. Adicione a primeira e informe quantas faltas ela permite.</div>';
  else h+='<div class="grid">'+S.subjects.map(function(s){var st=state(s),rem=Math.max(0,s.max-s.used),bx="";
    if(s.max<=40){for(var i=0;i<s.max;i++)bx+='<button class="bx'+(i<s.used?" on":"")+'" data-b="'+s.id+":"+i+'" aria-label="Falta '+(i+1)+'"></button>';bx='<div class="boxes">'+bx+"</div>"}
    else bx='<div class="meter"><i style="width:'+Math.min(100,s.used/s.max*100)+'%"></i></div>';
    return '<div class="card sc" style="--c:'+s.color+'"><div class="row"><b>'+esc(s.name)+'</b><span><button class="x" data-ed="'+s.id+'" aria-label="Editar">✎</button><button class="x" data-del="'+s.id+'" aria-label="Remover">×</button></span></div>'+
    '<div class="row" style="margin-top:10px;align-items:flex-end"><div><div class="big" style="color:'+st[0]+'">'+rem+'</div><span class="sub">'+(rem===1?"falta restante":"faltas restantes")+'</span></div><div style="text-align:right"><span class="tag" style="background:'+st[0]+'">'+st[1]+'</span><div class="sub" style="margin:6px 0 0">'+s.used+" de "+s.max+" usadas"+(s.used>s.max?" (+"+(s.used-s.max)+")":"")+"</div></div></div>"+bx+
    '<div class="row"><button class="ghost" data-m="'+s.id+'">− 1</button><button class="btn" data-p="'+s.id+'">+ 1 falta</button></div></div>'}).join("")+"</div>";
  $("#app").innerHTML=h;
  $("#add").onclick=function(){go("materias")};
  var d=$("#demo");if(d)d.onclick=function(){[["Cálculo I",8],["Física Geral",12],["Programação",8],["Álgebra Linear",4]].forEach(function(x,i){S.subjects.push({id:uid(),name:x[0],max:x[1],used:i===2?6:i,color:PAL[i]})});S.events.push({id:uid(),subj:S.subjects[0].id,type:"prova",title:"P1",date:"2027-03-25"},{id:uid(),subj:S.subjects[2].id,type:"trabalho",title:"Projeto final",date:"2027-03-30"});save();render()};
  $$("[data-p]").forEach(function(b){b.onclick=function(){bump(b.dataset.p,1)}});
  $$("[data-m]").forEach(function(b){b.onclick=function(){bump(b.dataset.m,-1)}});
  $$("[data-b]").forEach(function(b){b.onclick=function(){var a=b.dataset.b.split(":"),s=subj(a[0]),i=+a[1],v=s.used===i+1?i:i+1;bump(s.id,v-s.used)}});
  $$("[data-ed]").forEach(function(b){b.onclick=function(){subjForm(subj(b.dataset.ed))}});
  $$("[data-del]").forEach(function(b){b.onclick=function(){if(true){delSubj(b.dataset.del);return;var id=b.dataset.del;S.subjects=S.subjects.filter(function(s){return s.id!==id});S.events=S.events.filter(function(e){return e.subj!==id});Object.keys(S.slots).forEach(function(k){if(S.slots[k].replace("study:","")===id)delete S.slots[k]});save();render()}}});
}

function vRotina(){
